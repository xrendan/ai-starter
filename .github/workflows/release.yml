name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run tests
      run: go test -v ./...

    - name: Build binaries
      run: |
        # Build for multiple platforms
        GOOS=linux GOARCH=amd64 go build -o ai-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -o ai-linux-arm64 .
        GOOS=darwin GOARCH=amd64 go build -o ai-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -o ai-darwin-arm64 .
        GOOS=windows GOARCH=amd64 go build -o ai-windows-amd64.exe .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ai-linux-amd64
          ai-linux-arm64
          ai-darwin-amd64
          ai-darwin-arm64
          ai-windows-amd64.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
