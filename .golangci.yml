version: 2

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true

formatters-settings:
  goimports:
    local-prefixes:
      - github.com/xrendan/ai-starter

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Defer error checking is acceptable in cleanup code in tests
    - path: "_test\\.go"
      linters:
        - errcheck
      text: "os\\.Chdir"
